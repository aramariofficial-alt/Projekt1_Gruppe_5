<main>
    <article id="form">
        <form>
            <label for="name">Navn:</label>
            <input id="name" name="name" type="text"> <br> <br>
            <label for="email">Email:</label>
            <input id="email" name="email" type="text">
            <br><br>

            <label>Køn:</label>
            <label>
                <input type="radio" name="sex" value="male"> Mand
            </label>

            <label>
                <input type="radio" name="sex" value="female"> Kvinde
            </label>
            <br> <br>

            <label for="usertype">Brugertype:</label>
            <select id="usertype" name="country">
                <option value="">Vælg en valgmulighed</option>
                <option value="forbruger">Forbruger</option>
                <option value="virksomhed">Virksomhed</option>
                <option value="organisation">Organisation</option>
            </select>
            <br> <br>

            <label for="message">Besked: </label>
            <br> <br>

            <textarea id="message" name="message" cols="30" rows="10"></textarea>
            <br> <br>

            <input id="subscribe" name="subscribe" type="checkbox">
            <label for="subscribe"> Jeg vil gerne modtage nyheder om Danmark Mod Madspild </label>
            <br> <br>
            <button class="button">Submit</button>
        </form>
    </article>
</main>
